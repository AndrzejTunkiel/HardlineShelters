<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hardline Shelters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Silkscreen&display=swap">
<style>
/* Layout: control-room board. Top status bar, pixel tunnel map (left, wide), shelter panel (right); stacks on phones. Deliberately dark, single look. */
:root{
  --rock:#1b1624;      /* page ground: deep rock */
  --panel:#272033;     /* raised panels */
  --panel-hi:#3a3050;  /* bevel light */
  --panel-lo:#120e19;  /* bevel shadow */
  --paper:#efe6cf;     /* text */
  --muted:#a197b4;     /* secondary text */
  --amber:#f2b33d;     /* accent: power, selection, primary actions */
  --water:#4a9be8;
  --air:#9df0e4;
  --fuel:#e8793c;
  --ok:#77d65b;
  --warn:#f2b33d;
  --bad:#ec4b3f;
  --f-ui:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
  --f-label:'Silkscreen','Courier New',monospace;
  color-scheme:dark;
}
html,body{background:var(--rock);color:var(--paper)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.35}
button,input,select{font:inherit;color:inherit}
.app{max-width:1500px;margin:0 auto;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.px{background:var(--panel);border:2px solid var(--panel-lo);box-shadow:inset 2px 2px 0 var(--panel-hi),inset -2px -2px 0 #1a1424}
.lbl{font-family:var(--f-label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 14px}
.brand{display:flex;flex-direction:column;line-height:1;margin-right:auto}
.brand b{font-family:var(--f-label);font-size:22px;letter-spacing:.06em;color:var(--amber);font-weight:400}
.brand span{font-family:var(--f-label);font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.1em}
.clock{font-size:20px;font-weight:500}
.defcon{display:flex;align-items:center;gap:6px}
.pips{display:flex;gap:3px}
.pip{width:14px;height:14px;background:#2e2640;border:2px solid var(--panel-lo)}
.pip.on{background:var(--c)}
.pip.blink{animation:blink 1s steps(1) infinite}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat strong{font-size:18px;font-weight:500}
.btn{background:var(--panel-hi);border:2px solid var(--panel-lo);box-shadow:inset 2px 2px 0 #50466a,inset -2px -2px 0 #241c33;padding:6px 12px;cursor:pointer;font-weight:500;position:relative;line-height:1.2}
.btn:hover{background:#463b60}
.btn:active{box-shadow:inset -2px -2px 0 #50466a,inset 2px 2px 0 #241c33;transform:translateY(1px)}
.btn:focus-visible,.tab:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn.primary{background:var(--amber);color:#2a1a05;box-shadow:inset 2px 2px 0 #ffd77e,inset -2px -2px 0 #b97a12}
.btn.primary:hover{background:#ffc04f}
.btn.danger{background:#7a2a2a;box-shadow:inset 2px 2px 0 #a0403c,inset -2px -2px 0 #4a1717}
.btn.small{padding:3px 8px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.badge{display:inline-block;min-width:20px;padding:0 5px;margin-left:6px;background:var(--bad);color:#fff;font-family:var(--f-label);font-size:11px;line-height:18px;text-align:center}
.badge.flash{animation:blink .8s steps(1) infinite}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;align-items:start}
.mapcard{padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mapscroll{overflow-x:auto;overflow-y:hidden;position:relative}
#map{display:block;width:100%;min-width:640px;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:none;background:#1d1826}
.maphint{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:14px;color:var(--muted)}
.key{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:6px;display:inline-block}
#hint{color:var(--paper)}
#hint.pick{color:var(--amber);animation:blink 1s steps(1) infinite}
.side{display:flex;flex-direction:column;min-width:0}
.tabs{display:flex}
.tab{flex:1;padding:8px 6px;background:#1f192b;border:2px solid var(--panel-lo);border-bottom:none;cursor:pointer;font-family:var(--f-label);font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--panel);color:var(--amber)}
.sidebody{padding:12px;display:flex;flex-direction:column;gap:12px;min-height:520px}
.sect{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:2px dashed #3a3050}
.sect:first-child{border-top:none;padding-top:0}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.big{font-size:22px;font-weight:500}
.chip{font-family:var(--f-label);font-size:11px;padding:2px 6px;border:2px solid currentColor}
.chip.OK{color:var(--ok)}.chip.WARN{color:var(--warn)}.chip.CRIT{color:var(--bad);animation:blink 1s steps(1) infinite}.chip.DARK,.chip.EVAC{color:var(--muted)}
.meter{height:14px;background:#15111d;border:2px solid var(--panel-lo);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--c);
  background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.28) 6px 8px)}
.meter b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--paper)}
.stack{display:flex;height:16px;background:#15111d;border:2px solid var(--panel-lo);position:relative}
.stack span{height:100%;background:var(--c);background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.25) 6px 8px)}
.stack span.off{background:repeating-linear-gradient(45deg,var(--bad) 0 3px,#15111d 3px 6px)}
.stack b{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--paper)}
.ledger{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px}
.ledger .tot{border-top:2px solid #3a3050;padding-top:2px;font-weight:500}
.pos{color:var(--ok)}.neg{color:var(--bad)}.dim{color:var(--muted)}
.equip{display:grid;grid-template-columns:96px 1fr auto;gap:6px 8px;align-items:center;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.lines{display:flex;flex-direction:column;gap:6px}
.lineitem{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;font-size:14px;cursor:pointer;padding:4px;border:2px solid transparent}
.lineitem:hover{border-color:#3a3050}
.minibars{display:flex;flex-direction:column;gap:2px}
.mb{height:5px;background:#15111d;position:relative}
.mb i{position:absolute;inset:0 auto 0 0;background:var(--c)}
.flow{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:8px;background:#1f192b;border:2px solid var(--panel-lo);font-size:14px}
.flow input[type=range]{grid-column:1/-1}
.ticker{padding:8px 12px;display:flex;gap:10px;align-items:baseline;font-size:14px;min-width:0}
.ticker .lbl{flex:none}
.ticker div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* range */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:#15111d;border:2px solid var(--panel-lo)}
input[type=range]::-moz-range-track{height:8px;background:#15111d;border:2px solid var(--panel-lo)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:18px;margin-top:-7px;background:var(--c,var(--amber));border:2px solid var(--panel-lo)}
input[type=range]::-moz-range-thumb{width:12px;height:16px;border-radius:0;background:var(--c,var(--amber));border:2px solid var(--panel-lo)}
input[type=number]{width:90px;background:#15111d;border:2px solid var(--panel-lo);padding:2px 6px;text-align:right}

/* modals */
.veil{position:fixed;inset:0;background:rgba(10,7,14,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(760px,100%);max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font-family:var(--f-label);font-weight:400;font-size:18px;color:var(--amber);letter-spacing:.04em;text-wrap:balance}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.xres{display:flex;flex-direction:column;gap:6px;padding:10px;background:#1f192b;border:2px solid var(--panel-lo)}
.xres.na{opacity:.55}
.xres .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.xres .ico{width:16px;height:16px;background:var(--c)}
.xres h3{margin:0;font-size:17px;font-weight:500;flex:1}
.fx{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px}
.fx>div{background:#1f192b;border:2px solid var(--panel-lo);padding:8px}
.mail{display:grid;grid-template-columns:260px minmax(0,1fr);gap:12px;min-height:420px}
.mlist{display:flex;flex-direction:column;gap:2px;max-height:520px;overflow:auto;background:#1f192b;border:2px solid var(--panel-lo);padding:4px}
.mitem{display:flex;flex-direction:column;padding:6px 8px;cursor:pointer;border:2px solid transparent;font-size:14px;line-height:1.2}
.mitem .s{font-weight:500}
.mitem.unread .s::before{content:"";display:inline-block;width:8px;height:8px;background:var(--amber);margin-right:6px}
.mitem.flash .s{color:var(--bad)}
.mitem.sel{background:var(--panel-hi);border-color:var(--amber)}
.mitem .f{color:var(--muted);font-size:13px}
.reader{display:flex;flex-direction:column;gap:10px;min-width:0}
.reader .hd{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
.reader pre{white-space:pre-wrap;font-family:var(--f-ui);font-size:16px;margin:0;line-height:1.45;max-width:66ch}
.reader pre.flash{color:#ffb4a8}
.opts{display:flex;flex-direction:column;gap:6px}
.opts .btn{text-align:left}
.opts .btn.sel{outline:2px solid var(--amber);outline-offset:1px}
.title-screen{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.title-screen h1{margin:0;font-family:var(--f-label);font-weight:400;font-size:44px;color:var(--amber);line-height:1}
.title-screen p{margin:0;max-width:60ch}
.evlist{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.evlist li::before{content:"▸ ";color:var(--amber)}
table.res{border-collapse:collapse;width:100%;font-size:15px}
table.res td,table.res th{padding:4px 8px;text-align:left;border-bottom:2px solid #3a3050}
table.res th{font-family:var(--f-label);font-size:11px;color:var(--muted);font-weight:400}
.toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;padding:10px 14px;max-width:min(640px,calc(100% - 32px));font-size:15px}
.toast.err{border-color:var(--bad);color:#ffd0c8}
.tip{position:fixed;z-index:40;pointer-events:none;padding:6px 8px;font-size:13px;line-height:1.3;max-width:260px}
@keyframes blink{50%{opacity:.25}}
@media (max-width:1050px){.main{grid-template-columns:1fr}.sidebody{min-height:0}}
@media (max-width:640px){.mail{grid-template-columns:1fr}.mlist{max-height:220px}.fx{grid-template-columns:1fr}.brand{margin-right:0;width:100%}}
@media (prefers-reduced-motion:reduce){.pip.blink,.chip.CRIT,.badge.flash,#hint.pick{animation:none}}
</style>

<style>
/* builder additions */
.phase{font-family:var(--f-label);font-size:11px;padding:3px 8px;border:2px solid var(--amber);color:var(--amber);letter-spacing:.08em}
.phase.war{border-color:var(--bad);color:var(--bad)}
.designer{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
#xsec{display:block;width:360px;max-width:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#2b2240;border:2px solid var(--panel-lo)}
.dctl{display:flex;flex-direction:column;gap:12px;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg .btn{min-width:46px}
.seg .btn.on{background:var(--amber);color:#2a1a05;box-shadow:inset 2px 2px 0 #ffd77e,inset -2px -2px 0 #b97a12}
.floors{display:flex;flex-direction:column;gap:2px;max-height:230px;overflow:auto;background:#1f192b;border:2px solid var(--panel-lo);padding:4px}
.floor{display:grid;grid-template-columns:34px 76px 1fr 86px 56px;gap:6px;align-items:center;font-size:14px;padding:2px 4px}
.floor select{background:#15111d;border:2px solid var(--panel-lo);padding:1px 4px}
.mat{font-family:var(--f-label);font-size:10px;padding:1px 4px}
.mat.sand{background:#c9a85e;color:#2a1a05}.mat.rock{background:#77757f;color:#fff}.mat.mix{background:linear-gradient(90deg,#c9a85e 50%,#77757f 50%);color:#fff}
.mods{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;gap:6px 8px;align-items:center;font-size:14px}
.mods .sw{width:14px;height:14px}
.cnt{display:inline-flex;align-items:center;gap:4px}
.cnt b{min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.kv>div{background:#1f192b;border:2px solid var(--panel-lo);padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.kv .v{font-size:18px;font-weight:500}
.kv .v.neg{color:var(--bad)}.kv .v.pos{color:var(--ok)}
.warns{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none;font-size:14px}
.warns li.err{color:var(--bad)}.warns li.warn{color:var(--warn)}
.warns li::before{content:"■ "}
#prof{display:block;width:100%;image-rendering:pixelated;background:#2b2240;border:2px solid var(--panel-lo)}
.check{display:flex;gap:12px;flex-wrap:wrap}
.check label{display:inline-flex;gap:6px;align-items:center;cursor:pointer;padding:4px 8px;background:#1f192b;border:2px solid var(--panel-lo)}
.check input{accent-color:var(--amber);width:16px;height:16px}

/* type: Silkscreen only at whole multiples of its 8px grid; everything small uses Pixelify Sans */
.lbl{font-family:var(--f-ui);font-size:13px;font-weight:500;letter-spacing:.08em}
.brand b{font-size:24px}
.brand span{font-family:var(--f-ui);font-size:12px;font-weight:500;letter-spacing:.12em}
.chip,.phase,.mat,.badge{font-family:var(--f-ui);font-weight:500;letter-spacing:.06em}
.chip{font-size:12px}.phase{font-size:13px}.mat{font-size:11px}.badge{font-size:12px}
.tab{font-family:var(--f-ui);font-size:14px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.modal h2{font-size:16px;letter-spacing:.04em}
.title-screen h1{font-size:48px}
/* fade to war */
[hidden]{display:none!important}
#fade{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;opacity:0;transition:opacity 1.1s ease;cursor:pointer;padding:24px}
#fade.on{opacity:1}
#fade .fl{font-family:var(--f-label);font-size:16px;color:var(--paper);letter-spacing:.08em;text-align:center;animation:flin .6s steps(4) both}
#fade .fl.dim{color:var(--muted)}
#fade .fl.red{font-size:48px;color:var(--bad);animation:flin .2s steps(2) both,blink .7s steps(1) .2s infinite}
@keyframes flin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#fade{transition-duration:.2s}#fade .fl,#fade .fl.red{animation:none}}

/* readable type: Plex for everything people read; the pixel face only for big display text */
:root{--f-ui:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;--f-label:'IBM Plex Sans Condensed','Arial Narrow',sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,monospace;--f-pixel:'Silkscreen','Courier New',monospace}
body{font-size:15px;line-height:1.45}
.lbl{font-family:var(--f-label);font-size:12px;font-weight:600;letter-spacing:.07em}
.brand b{font-family:var(--f-pixel);font-size:24px}
.brand span{font-family:var(--f-label);font-size:12px;font-weight:600;letter-spacing:.1em}
.chip,.phase,.badge,.mat,.tab{font-family:var(--f-label);font-weight:600;letter-spacing:.06em}
.chip{font-size:12px}.phase{font-size:13px}.badge{font-size:12px}.mat{font-size:11px}.tab{font-size:13px}
.big{font-family:var(--f-label);font-size:22px;font-weight:600}
.stat strong{font-family:var(--f-label);font-weight:600}
.clock,.kv .v{font-family:var(--f-label);font-weight:600}
.btn{font-family:var(--f-ui);font-weight:500}
.modal h2{font-family:var(--f-label);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.title-screen h1{font-family:var(--f-pixel);font-size:48px}
.reader pre{font-family:var(--f-mono);font-size:14.5px;line-height:1.55}
.mitem{font-size:14px}.mitem .s{font-weight:600}
.tip{font-size:13.5px;line-height:1.4}
#fade .fl{font-family:var(--f-mono);font-size:16px;font-weight:500}
#fade .fl.red{font-family:var(--f-pixel);font-size:56px}

/* end-of-watch statistics */
svg.chart{display:block;width:100%;height:auto;overflow:visible;touch-action:none}
svg.chart.mini{width:160px;height:34px}
svg.chart .ax{font-family:var(--f-label);font-size:11px;font-weight:600;fill:var(--muted)}
.readout{font-size:13px;min-height:1.4em;font-variant-numeric:tabular-nums}
td.spark{padding:2px 8px}
.endcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.endcols.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.cause{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:14px}
@media (max-width:760px){.endcols,.endcols.three{grid-template-columns:1fr}}

/* campaign menu */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;width:100%}
.mcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px;background:#1f192b;border:2px solid var(--panel-lo);box-shadow:inset 2px 2px 0 var(--panel-hi);cursor:pointer;color:var(--paper)}
.mcard:hover:not([disabled]){border-color:var(--amber)}
.mcard b{font-family:var(--f-label);font-size:20px;font-weight:700}
.mcard.locked{opacity:.45;cursor:not-allowed}
.mstat{font-size:13px;color:var(--muted)}
.stars{color:var(--amber);letter-spacing:.1em}
.mresult{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:10px 12px;border:2px solid var(--panel-lo);background:#1f192b}
.mresult b{font-family:var(--f-label);font-size:22px}
.mresult.pass b{color:var(--ok)}.mresult.fail b{color:var(--bad)}
@media (max-width:760px){.designer{grid-template-columns:1fr}#xsec{width:100%}.floor{grid-template-columns:30px 70px 1fr 80px}.floor .bays{display:none}}
</style>

</head>
<body>
<div class="app">
  <header class="bar px">
    <div class="brand"><b>HARDLINE</b><span>REGION 7 SHELTER PROGRAM</span></div>
    <span class="phase" id="phase">CONSTRUCTION</span>
    <div class="stat" id="st1"><span class="lbl"></span><strong class="num"></strong></div>
    <div class="stat" id="st2"><span class="lbl"></span><strong class="num"></strong></div>
    <div class="stat" id="st3"><span class="lbl"></span><strong class="num"></strong></div>
    <div class="stat" id="st4"><span class="lbl"></span><strong class="num"></strong></div>
    <button class="btn" id="menuBtn" type="button">Menu</button>
    <button class="btn" id="mailBtn" type="button">Mail<span class="badge" id="mailBadge" hidden></span></button>
    <button class="btn primary" id="mainBtn" type="button">Commission ▸</button>
  </header>
  <div class="main">
    <section class="mapcard px">
      <div class="mapscroll"><canvas id="map" width="640" height="360" aria-label="Region map"></canvas></div>
      <div class="maphint"><span id="hint"></span></div>
      <div class="maphint" id="legend"></div>
    </section>
    <aside class="side">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="sidebody px" id="side"></div>
    </aside>
  </div>
  <footer class="ticker px"><span class="lbl">Latest</span><div id="ticker"></div></footer>
</div>
<div id="modalRoot"></div>
<div class="toast px" id="toast" hidden></div>
<div class="tip px" id="tip" hidden></div>
<div id="fade" hidden aria-live="assertive"></div>
<script>
(()=>{
'use strict';
/* ================= core ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const R0=v=>Math.round(v);
const pad=(v,n)=>String(v).padStart(n);
const num=n=>Math.round(n).toLocaleString('en-US');
const money=n=>'$'+num(n);
const mil=n=>(n<0?'−':'')+'$'+(Math.abs(n)/1e6).toFixed(2)+'M';
const sgn=n=>(n>=0?'+':'−')+num(Math.abs(n));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();
const rnd=()=>Math.random();
function mul(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const MW=160,MH=90,MPC=25,MAXSITES=6;
const WAR=0,RELIEF=12;
const UNIT={W:'L/shift',A:'CFM',P:'kW'},RNAME={W:'WATER',A:'AIR',P:'POWER'},LOSS={W:.98,A:.95,P:.97};
const CFM_PER_PERSON=5,WATER_PER_PERSON=3.5,FOOD_PER_PERSON=.25;
const COL={W:'#4a9be8',A:'#9df0e4',P:'#f2b33d',F:'#e8793c',FOOD:'#c9a46a'};
const DIM={W:'#24456b',A:'#3a6560',P:'#6a5222'};
const SITE_NAMES=['HOLLOW CREEK','IRON RIDGE','BLACKWATER','CEDAR FLATS','MERIDIAN','KESTREL'];
const WARDENS=['R. OKAFOR','M. VARGA','D. BRANDT','J. LINDQVIST','A. RUIZ','E. HADDAD'];
const TOWN_NAMES=['HARLAN','DUNMORE','ASHBY','CORVIN','PELL','MARROW','TESKE','OSWIN'];
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let G=null,WD=null,S=null;
const UI={sel:null,selLink:null,tab:'site',modal:null,drag:null,pick:null,hover:null,hoverLink:null,hoverCell:null,N:null,geo:false,mouse:null};

/* ================= world ================= */
const idx=(x,y)=>y*MW+x;
function makeNoise(seed){const r=mul(seed),P=new Float32Array(65536);for(let i=0;i<65536;i++)P[i]=r();const s=t=>t*t*(3-2*t);
  return (x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),u=s(x-xi),v=s(y-yi),h=(i,j)=>P[((i&255)<<8)|(j&255)];const a=h(xi,yi),b=h(xi+1,yi),c=h(xi,yi+1),d=h(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};}
function fbm(n,x,y,o){let s=0,a=1,f=1,t=0;for(let i=0;i<o;i++){s+=a*n(x*f+i*17.3,y*f+i*9.1);t+=a;a*=.5;f*=2;}return s/t;}
class Heap{constructor(){this.a=[];}get size(){return this.a.length;}
  push(k,v){const a=this.a;a.push([k,v]);let i=a.length-1;while(i>0){const p=(i-1)>>1;if(a[p][0]<=a[i][0])break;[a[p],a[i]]=[a[i],a[p]];i=p;}}
  pop(){const a=this.a,top=a[0],last=a.pop();if(a.length){a[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<a.length&&a[l][0]<a[m][0])m=l;if(r<a.length&&a[r][0]<a[m][0])m=r;if(m===i)break;[a[m],a[i]]=[a[i],a[m]];i=m;}}return top;}}
const D4=[[1,0],[-1,0],[0,1],[0,-1]];
const cellCost=i=>[14,1,2.2,3.5][WD.type[i]];
function dijkstra(start,isTarget){
  const N=MW*MH,dist=new Float64Array(N).fill(1e9),prev=new Int32Array(N).fill(-1),h=new Heap();dist[start]=0;h.push(0,start);
  while(h.size){const [d,i]=h.pop();if(d>dist[i])continue;
    if(i!==start&&isTarget(i)){const p=[];for(let k=i;k!==-1;k=prev[k])p.push(k);return p.reverse();}
    const x=i%MW,y=(i/MW)|0;
    for(const [dx,dy] of D4){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;const j=idx(nx,ny);const nd=d+(WD.road[j]?.35:cellCost(j));if(nd<dist[j]){dist[j]=nd;prev[j]=i;h.push(nd,j);}}}
  return [start];
}
function genWorld(seed,opts){
  const r=mul(seed),n1=makeNoise(seed+11),n2=makeNoise(seed+23),n3=makeNoise(seed+37);
  const N=MW*MH,elev=new Float32Array(N),moist=new Float32Array(N),sn=new Float32Array(N),sand=new Float32Array(N),type=new Uint8Array(N);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const i=idx(x,y);elev[i]=fbm(n1,x/34,y/34,4);moist[i]=fbm(n2,x/20,y/20,3);sn[i]=fbm(n3,x/26,y/26,3);}
  const se=Array.from(elev).sort((a,b)=>a-b),wl=se[Math.floor(N*.14)],hl=se[Math.floor(N*.86)],emax=se[N-1];
  const ss=Array.from(sn).sort((a,b)=>a-b),s0=ss[Math.floor(N*.04)],s1=ss[Math.floor(N*.96)];
  for(let i=0;i<N;i++){const e=elev[i];type[i]=e<wl?0:e>hl?3:moist[i]>.56?2:1;
    let m=3+clamp((sn[i]-s0)/(s1-s0),0,1)*37;if(e>hl)m-=(e-hl)/(emax-hl)*34;sand[i]=type[i]===0?0:clamp(m,0,42);}
  const rn=mul(seed+5),names=TOWN_NAMES.slice();for(let i=names.length-1;i>0;i--){const j=Math.floor(rn()*(i+1));[names[i],names[j]]=[names[j],names[i]];}const towns=[];
  for(let k=0;k<6000&&towns.length<4;k++){const x=9+Math.floor(r()*(MW-18)),y=9+Math.floor(r()*(MH-18)),i=idx(x,y);
    if(type[i]===0||type[i]===3)continue;if(towns.some(t=>Math.hypot(t.x-x,t.y-y)<40))continue;
    towns.push({x,y,name:names[towns.length],pop:(3+Math.floor(r()*6))*100});}
  let cc=null;
  for(let rad=0;rad<70&&!cc;rad++)for(let dy=-rad;dy<=rad&&!cc;dy++)for(let dx=-rad;dx<=rad&&!cc;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==rad)continue;
    const x=80+dx,y=45+dy;if(x<10||y<10||x>MW-11||y>MH-11)continue;const i=idx(x,y);if(type[i]===0||type[i]===3)continue;if(towns.some(t=>Math.hypot(t.x-x,t.y-y)<14))continue;cc={x,y};}
  if(opts&&opts.towns){towns.length=0;opts.towns.forEach(t=>towns.push({...t}));cc={...opts.cc};}
  WD={seed,elev,sand,type,towns,cc,wl,hl,road:new Uint8Array(N),base:null};
  WD.road[idx(cc.x,cc.y)]=1;
  const order=towns.slice().sort((a,b)=>Math.hypot(a.x-cc.x,a.y-cc.y)-Math.hypot(b.x-cc.x,b.y-cc.y));
  for(const t of order)dijkstra(idx(t.x,t.y),i=>WD.road[i]===1).forEach(i=>WD.road[i]=1);
  const far=order[order.length-1];
  dijkstra(idx(far.x,far.y),i=>{const x=i%MW,y=(i/MW)|0;return x===0||y===0||x===MW-1||y===MH-1;}).forEach(i=>WD.road[i]=1);
  WD.base=WD.road.slice();
  renderTerrain();recomputeRoads();
}
const sandAt=(x,y)=>WD.sand[idx(clamp(Math.round(x),0,MW-1),clamp(Math.round(y),0,MH-1))];
const TYPE_NAME=['Water','Grassland','Forest','Hills'];
function nearestTown(x,y){let best=null,bd=1e9;for(const t of WD.towns){const d=Math.hypot(t.x-x,t.y-y);if(d<bd){bd=d;best=t;}}return [best,bd];}

/* ---------------- terrain render ---------------- */
let TER=null,GEO=null,ROADS=null;
function renderTerrain(){
  const r=mul(WD.seed+99);
  TER=document.createElement('canvas');TER.width=640;TER.height=360;const t=TER.getContext('2d');
  GEO=document.createElement('canvas');GEO.width=640;GEO.height=360;const g2=GEO.getContext('2d');
  const P=(c,x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h);};
  const grass=['#4d7a3c','#52803f','#497537'];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const i=idx(x,y),ty=WD.type[i],px=x*4,py=y*4,e=WD.elev[i];
    if(ty===0){P(t,px,py,4,4,'#2c5b97');const shore=D4.some(([dx,dy])=>{const nx=x+dx,ny=y+dy;return nx>=0&&ny>=0&&nx<MW&&ny<MH&&WD.type[idx(nx,ny)]!==0;});
      if(shore)P(t,px,py,4,4,'#36689f');if(r()<.12)P(t,px+((r()*3)|0),py+((r()*4)|0),2,1,'#5a8fcc');}
    else if(ty===1){P(t,px,py,4,4,grass[(r()*3)|0]);if(r()<.06)P(t,px+((r()*4)|0),py+((r()*4)|0),1,1,'#7aa556');}
    else if(ty===2){P(t,px,py,4,4,'#2f5530');P(t,px+((r()*2)|0),py,3,2,'#3f6e3a');P(t,px+1,py+2,1,2,'#1f3b23');}
    else{const band=Math.floor((e-WD.hl)*60)%2;P(t,px,py,4,4,band?'#7b6d4c':'#857655');if(WD.sand[i]<5&&r()<.5)P(t,px+((r()*3)|0),py+((r()*3)|0),2,2,'#9a9284');}
    // geology
    const sd=WD.sand[i];
    if(ty===0)P(g2,px,py,4,4,'#1d3352');
    else{const k=sd/42,c=sd<2?'#6a6874':`rgb(${R0(120+k*120)},${R0(118+k*96)},${R0(126-k*40)})`;P(g2,px,py,4,4,c);
      const b=Math.floor(sd/10);for(const [dx,dy] of [[1,0],[0,1]]){const nx=x+dx,ny=y+dy;if(nx<MW&&ny<MH&&WD.type[idx(nx,ny)]!==0&&Math.floor(WD.sand[idx(nx,ny)]/10)!==b)P(g2,dx?px+3:px,dy?py+3:py,dx?1:4,dy?1:4,'#3b3346');}}
  }
  for(const tw of WD.towns){const rr=mul(tw.x*131+tw.y);for(let k=0;k<14;k++){const hx=tw.x*4+R0((rr()-.5)*22),hy=tw.y*4+R0((rr()-.5)*16);
    for(const c of [t,g2]){P(c,hx,hy,4,3,'#d8c6a0');P(c,hx,hy,4,1,'#a2483a');P(c,hx+1,hy+2,1,1,'#3b2f2a');}}}
}
function renderRoads(){
  ROADS=document.createElement('canvas');ROADS.width=640;ROADS.height=360;const c=ROADS.getContext('2d');
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const i=idx(x,y);if(!WD.road[i])continue;const px=x*4,py=y*4;
    c.fillStyle=WD.type[i]===0?'#6e5c45':'#5e594f';c.fillRect(px,py,4,4);}
  c.fillStyle='#a39c8c';
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const i=idx(x,y);if(!WD.road[i])continue;const px=x*4,py=y*4;c.fillRect(px+1,py+1,2,2);
    if(x+1<MW&&WD.road[idx(x+1,y)])c.fillRect(px+2,py+1,4,2);if(y+1<MH&&WD.road[idx(x,y+1)])c.fillRect(px+1,py+2,2,4);}
}

/* ================= construction model ================= */
const MODS={
  BUNK:{name:'Living quarters',cost:4000,color:'#e8c48a',desc:'8 beds in triple bunks'},
  STORE:{name:'Storage',cost:6000,color:'#a0805a',desc:'1,500 person-days of food, 1 spares kit, 1 LiOH pallet'},
  AIR:{name:'Air scrubbers',cost:35000,color:'#9df0e4',desc:'700 CFM, enough for 140 people · 7 kW'},
  WATER:{name:'Water tank',cost:14000,color:'#4a9be8',desc:'8,000 L'},
  FILTER:{name:'Water filtration',cost:30000,color:'#2fb8c9',desc:'recycles 600 L a shift at half recovery · 6 kW'},
  FUEL:{name:'Fuel tank',cost:12000,color:'#e8793c',desc:'2,000 L diesel'},
  GEN:{name:'Generator',cost:45000,color:'#f2b33d',desc:'60 kW diesel genset'},
};
const MOD_ORDER=['BUNK','STORE','AIR','WATER','FILTER','FUEL','GEN'];
const DIAMS=[8,10,12,14,16,18,20];
const MAXFLOORS=20;
const baysFor=d=>Math.max(0,Math.floor((Math.PI*d*d/4-10)/10));
const floorTop=i=>4+4*i;
const shaftDepth=s=>s.id==='CC'?40:4+4*s.floors.length;
const COST={sandDig:60,rockDig:300,sandLine:450,rockLine:60,road:{0:48000,1:8000,2:12000,3:16000},tunSand:250,tunRock:520,conduit:60,portal:40000};
function sectionCost(d,top,sand){
  const hs=clamp(sand-top,0,4),hr=4-hs,area=Math.PI*d*d/4,per=Math.PI*d;
  const dig=area*(hs*COST.sandDig+hr*COST.rockDig),line=per*(hs*COST.sandLine+hr*COST.rockLine);
  return {dig:dig*(1+(top+2)/60),line:line*(1+(top+2)/60),hs,hr};
}
function siteSand(s){return s.id==='CC'?6:sandAt(s.x,s.y);}
function rosterFor(s,beds){let p=0;for(const t of WD.towns){const d=Math.hypot(t.x-s.x,t.y-s.y);p+=t.pop*Math.max(0,1-d/50);}
  const fill=clamp(.72+p/1400,.72,1.14);return {roster:R0(beds*fill),fill};}
function siteStats(s){
  const sand=siteSand(s),depth=shaftDepth(s);
  let bays=0,dig=0,line=0,sandM=0,rockM=0;
  const hc=sectionCost(s.d0,0,sand);dig+=hc.dig;line+=hc.line;
  s.floors.forEach((d,i)=>{bays+=baysFor(d);const c=sectionCost(d,floorTop(i),sand);dig+=c.dig;line+=c.line;sandM+=c.hs;rockM+=c.hr;});
  sandM+=hc.hs;rockM+=hc.hr;
  const m=s.mods,used=MOD_ORDER.reduce((a,k)=>a+m[k],0);
  const fit=MOD_ORDER.reduce((a,k)=>a+m[k]*MODS[k].cost,0),head=200000+s.d0*10000;
  const beds=m.BUNK*8,{roster,fill}=rosterFor(s,beds);
  const prot=clamp((rockM*1.4+sandM*.45)/70,0,.9);
  const load=15+.06*(roster+12)+m.AIR*7+4+m.FILTER*6,gcap=m.GEN*60;
  const people=roster+12,use=people*WATER_PER_PERSON,rec=Math.min(use,m.FILTER*600)*.5;
  const wcap=m.WATER*8000,fcap=m.FUEL*2000,food=m.STORE*1500;
  const burn=2*Math.min(load,gcap);
  const stock=wcap*.12+fcap*1.1+food*.8;
  return {sand,depth,bays,used,dig,line,fit,head,road:s.roadCost||0,stock,total:dig+line+fit+head+stock+(s.roadCost||0),beds,roster,fill,prot,
    scrub:m.AIR*700,need:people*CFM_PER_PERSON,load,gcap,use,rec,wcap,fcap,food,
    waterSh:(use-rec)>0?wcap/(use-rec):99,fuelSh:burn?fcap/burn:0,foodSh:people?food/(people*FOOD_PER_PERSON):0,sandM,rockM};
}
function tunnelStats(t){
  const A=siteById(t.a),B=siteById(t.b),dx=B.x-A.x,dy=B.y-A.y,cells=Math.hypot(dx,dy),len=cells*MPC;
  const n=Math.max(2,Math.ceil(cells*2));let inSand=0;const prof=[];
  for(let k=0;k<=n;k++){const sd=sandAt(A.x+dx*k/n,A.y+dy*k/n);prof.push(sd);if(t.depth<=sd)inSand++;}
  const sandFrac=inSand/(n+1),rockFrac=1-sandFrac;
  const per=(sandFrac*COST.tunSand+rockFrac*COST.tunRock)*(1+t.depth/100)+(t.W+t.A+t.P)*COST.conduit;
  const cost=len*per+2*COST.portal;
  const rel=clamp(.3+rockFrac*.45+t.depth/150,.2,.97);
  return {len,cost,rockFrac,sandFrac,rel,prof,maxDepth:Math.min(shaftDepth(A),shaftDepth(B))};
}
function siteById(id){return id==='CC'?{id:'CC',x:WD.cc.x,y:WD.cc.y,name:'SHELTER CONTROL',floors:[],d0:10}:G.build.sites.find(s=>s.id===id);}
function suggestMods(s,target){
  const m={BUNK:0,STORE:0,AIR:0,WATER:0,FILTER:0,FUEL:0,GEN:0};
  const bays=s.floors.reduce((a,d)=>a+baysFor(d),0);if(!bays)return m;
  for(let beds=Math.max(8,(target||9999));beds>=8;beds-=8){
    m.BUNK=Math.ceil(beds/8);const {roster}=rosterFor(s,m.BUNK*8),p=roster+12;
    m.AIR=Math.ceil(p*CFM_PER_PERSON*1.3/700);m.FILTER=Math.max(1,Math.round(p*WATER_PER_PERSON/600/2));
    m.WATER=Math.ceil(p*WATER_PER_PERSON*.6*20/8000);m.STORE=Math.ceil(p*FOOD_PER_PERSON*22/1500);
    const load=15+.06*p+m.AIR*7+4+m.FILTER*6;m.GEN=Math.ceil(load*1.15/60);m.FUEL=Math.ceil(2*load*16/2000);
    const used=MOD_ORDER.reduce((a,k)=>a+m[k],0);if(used<=bays)return m;
    if(target)target=0;
  }
  return m;
}
function recomputeRoads(){
  WD.road=WD.base.slice();
  if(G)for(const s of G.build.sites){const p=dijkstra(idx(s.x,s.y),i=>WD.road[i]===1);let c=0;
    p.forEach((i,k)=>{if(k<p.length-1)c+=COST.road[WD.type[i]];WD.road[i]=1;});s.roadCost=c;s.roadCells=p.length-1;}
  renderRoads();
}
function placeOk(x,y,ignore){
  if(x<7||y<9||x>MW-8||y>MH-9)return 'Too close to the edge of the survey area.';
  const i=idx(x,y);if(WD.type[i]===0)return 'You cannot sink a shaft in a lake.';
  for(const t of WD.towns)if(Math.hypot(t.x-x,t.y-y)<5)return `That is inside ${cap1(t.name)}.`;
  const others=[{x:WD.cc.x,y:WD.cc.y,id:'CC'},...G.build.sites.filter(s=>s.id!==ignore)];
  for(const o of others)if(Math.hypot(o.x-x,o.y-y)<17)return `Too close to ${o.id}. Shelters need about 400 m between them.`;
  return null;
}
function buildTotals(){let sites=0,tun=0;for(const s of G.build.sites)sites+=siteStats(s).total;for(const t of G.build.tunnels)tun+=tunnelStats(t).cost;return {sites,tun,total:sites+tun,left:G.build.budget-sites-tun};}
function clampTunnels(){for(const t of G.build.tunnels){const mx=tunnelStats(t).maxDepth;if(t.depth>mx)t.depth=Math.max(8,mx-(mx%4));}}
function siteWarnings(s){const st=siteStats(s),w=[];
  if(st.used>st.bays)w.push(['err',`${s.id}: ${st.used} modules need ${st.used-st.bays} more bays than the shaft has.`]);
  if(!s.mods.BUNK)w.push(['err',`${s.id}: no living quarters.`]);
  if(!s.mods.GEN)w.push(['err',`${s.id}: no generator. Nothing runs when the grid fails.`]);
  else if(st.gcap<st.load)w.push(['warn',`${s.id}: generators give ${st.gcap} kW for a ${R0(st.load)} kW load.`]);
  if(st.scrub<st.need)w.push(['warn',`${s.id}: scrubbers cover ${R0(st.scrub/st.need*100)}% of the air ${st.roster+12} people need.`]);
  if(!s.mods.FUEL)w.push(['warn',`${s.id}: no fuel tank.`]);
  if(!s.mods.WATER)w.push(['warn',`${s.id}: no water tank.`]);
  if(!s.mods.FILTER)w.push(['warn',`${s.id}: no water filtration; nothing is recycled.`]);
  if(!s.mods.STORE)w.push(['warn',`${s.id}: no storage; no food or spare parts on site.`]);
  if(!G.build.tunnels.some(t=>t.a===s.id||t.b===s.id))w.push(['warn',`${s.id}: no tunnel. It will be on its own.`]);
  return w;}
function allWarnings(){const w=[];if(!G.build.sites.length)w.push(['err','Place at least one shelter.']);
  for(const s of G.build.sites)w.push(...siteWarnings(s));
  const b=buildTotals();if(b.left<0)w.unshift(['err',`Over budget by ${mil(-b.left)}.`]);return w;}
function newSite(x,y){
  const n=G.build.sites.length,used=new Set(G.build.sites.map(s=>s.slot));let slot=0;while(used.has(slot))slot++;
  const s={id:'S'+(slot+1),slot,x,y,name:SITE_NAMES[slot],warden:WARDENS[slot],d0:12,floors:Array(6).fill(12),mods:null,roadCost:0};
  const sand=sandAt(x,y);if(sand>20){s.d0=14;s.floors=Array(4).fill(14).concat([12,12]);}
  s.mods=suggestMods(s,260);return s;
}

/* ================= shared UI helpers ================= */
/* All canvases draw in logical pixels; TG.k maps them onto real device pixels so blocks stay square and text stays sharp. */
const cv=$('#map'),g=cv.getContext('2d');
let TG={c:g,k:1,w:640,h:360};
function fitCanvas(c,lw,lh){const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;let k=Math.max(1,r.width*dpr/lw);
  const W=Math.round(lw*k),H=Math.round(lh*k);if(c.width!==W||c.height!==H){c.width=W;c.height=H;}const x=c.getContext('2d');x.imageSmoothingEnabled=false;return {c:x,k:W/lw,w:lw,h:lh};}
function fitMap(){TG=fitCanvas(cv,640,360);}
function useTarget(t){const prev=TG;TG=t;return prev;}
const F=(x,y,w,h,col)=>{const k=TG.k,X=Math.round(x*k),Y=Math.round(y*k);TG.c.fillStyle=col;TG.c.fillRect(X,Y,Math.max(1,Math.round((x+w)*k)-X),Math.max(1,Math.round((y+h)*k)-Y));};
function blit(img,alpha=1){const c=TG.c;c.globalAlpha=alpha;c.drawImage(img,0,0,TG.c.canvas.width,TG.c.canvas.height);c.globalAlpha=1;}
function txt(s,x,y,col,align='left'){const c=TG.c,k=TG.k;c.font=`600 ${Math.max(10,Math.round(9.5*k))}px 'IBM Plex Sans Condensed','Arial Narrow',sans-serif`;c.textBaseline='top';c.textAlign=align;c.fillStyle=col;c.fillText(s,Math.round(x*k),Math.round(y*k));}
function txtS(s,x,y,c,align='left'){txt(s,x+1,y+1,'#0f0b15',align);txt(s,x,y,c,align);}
let AC=null,SOUND=true;
function tone(f,d,v=.03,type='square',when=0){if(!SOUND)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),gn=AC.createGain(),t=AC.currentTime+when;o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
const chime=()=>{tone(880,.1,.035);tone(1320,.14,.035,'square',.11);};
const buzz=()=>tone(140,.16,.045,'sawtooth');
const blip=()=>tone(1200,.035,.025);
const thud=()=>{tone(90,.2,.06,'triangle');tone(60,.3,.05,'triangle',.05);};
const alarm=()=>{for(let i=0;i<6;i++)tone(i%2?620:880,.22,.045,'square',i*.25);};
addEventListener('pointerdown',()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}});
let toastT=0;
function toast(t,err){const el=$('#toast');el.textContent=t;el.className='toast px'+(err?' err':'');el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,err?6000:4500);}
function act(res){const [ok,msg]=res;toast(msg,!ok);ok?blip():buzz();refresh();return ok;}
function modal(html,wide){$('#modalRoot').innerHTML=`<div class="veil" id="veil"><div class="modal px" role="dialog" aria-modal="true" style="${wide?`width:min(${wide}px,100%)`:''}">${html}</div></div>`;
  $('#veil').addEventListener('click',e=>{if(e.target.id==='veil'&&UI.modal&&!['boot','end','title'].includes(UI.modal.type))closeModal();});}
function closeModal(){UI.modal=null;$('#modalRoot').innerHTML='';refresh();}
const meter=(v,max,c,mark)=>`<div class="meter"><i style="width:${clamp(max?v/max:0,0,1)*100}%;--c:${c}"></i>${mark!=null?`<b style="left:${mark}%"></b>`:''}</div>`;
const L_=(a,b,cls='')=>`<span>${a}</span><span class="num ${cls}">${b}</span>`;
function toMap(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*640/r.width,(e.clientY-r.top)*360/r.height];}
function placeTip(e,html){const tip=$('#tip');if(!html){tip.hidden=true;return;}tip.hidden=false;tip.innerHTML=html;
  const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+16,y=e.clientY+16;if(x+w>innerWidth-8)x=e.clientX-w-12;if(y+h>innerHeight-8)y=e.clientY-h-12;tip.style.left=x+'px';tip.style.top=y+'px';}
function lineThick(ax,ay,bx,by,w,c){const dx=bx-ax,dy=by-ay,n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))));
  for(let k=0;k<=n;k++)F(Math.round(ax+dx*k/n-w/2),Math.round(ay+dy*k/n-w/2),w,w,c);}
const sitePx=s=>[s.x*4+2,s.y*4+2];

/* ================= build: map ================= */
function headframe(px,py,sel,col='#8b8c99'){
  if(sel){F(px-9,py-14,19,22,'#f2b33d');F(px-8,py-13,17,20,'#1b162480');}
  F(px-6,py+2,13,4,'#0f0b15');F(px-5,py+2,11,3,col);
  F(px-4,py-9,1,11,'#5d5e6b');F(px+4,py-9,1,11,'#5d5e6b');F(px-4,py-5,9,1,'#5d5e6b');F(px-4,py-1,9,1,'#5d5e6b');
  F(px-2,py-11,5,3,'#c9c9d6');F(px-1,py-10,3,1,'#5d5e6b');
}
function drawBuild(t){
  blit(UI.geo?GEO:TER);blit(ROADS);
  for(const tw of WD.towns){txtS(tw.name,tw.x*4,tw.y*4+12,'#efe6cf','center');txtS(`${tw.pop} PEOPLE`,tw.x*4,tw.y*4+21,'#c9bfa6','center');}
  // tunnels
  G.build.tunnels.forEach((tn,i)=>{const A=siteById(tn.a),B=siteById(tn.b),[ax,ay]=sitePx(A),[bx,by]=sitePx(B),ts=tunnelStats(tn);
    if(UI.selLink===i)lineThick(ax,ay,bx,by,9,'#f2b33d');
    lineThick(ax,ay,bx,by,7,'#120e19');
    const dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;
    for(const [k,o] of [['W',-2],['A',0],['P',2]])if(tn[k])lineThick(ax+nx*o,ay+ny*o,bx+nx*o,by+ny*o,1,COL[k]);
    const mx=(ax+bx)/2,my=(ay+by)/2;F(mx-16,my-6,32,11,'#0f0b15');F(mx-15,my-5,30,9,'#272033');txt(`${R0(ts.rel*100)}%`,mx,my-4,ts.rel<.5?'#ec4b3f':ts.rel<.75?'#f2b33d':'#77d65b','center');
  });
  // control
  const [cx_,cy_]=sitePx(siteById('CC'));
  F(cx_-8,cy_-3,17,7,'#0f0b15');F(cx_-7,cy_-2,15,5,'#9a9aa6');F(cx_-4,cy_-5,9,3,'#9a9aa6');F(cx_,cy_-12,1,7,'#c9c9d6');F(cx_-1,cy_-13,3,1,'#ec4b3f');
  if(UI.sel==='CC')F(cx_-10,cy_+6,21,1,'#f2b33d');
  txtS('CC CONTROL',cx_,cy_+8,'#f2b33d','center');
  // sites
  for(const s of G.build.sites){const [px,py]=sitePx(s),w=siteWarnings(s);
    headframe(px,py,UI.sel===s.id);
    txtS(`${s.id} ${s.name}`,px,py+8,UI.sel===s.id?'#f2b33d':'#efe6cf','center');
    if(w.some(x=>x[0]==='err')){F(px+6,py-14,7,8,'#0f0b15');F(px+7,py-13,5,6,(t/400|0)%2&&!reduced?'#ec4b3f':'#f2b33d');txt('!',px+9,py-13,'#0f0b15','center');}}
  // drag/move/ghost
  const d=UI.drag,h=UI.hoverCell;
  if(UI.pick&&UI.mouse){const A=siteById(UI.pick),[ax,ay]=sitePx(A);const [mx,my]=UI.mouse;const L=Math.hypot(mx-ax,my-ay),ph=reduced?0:(t*.03)%6;
    for(let s=ph;s<L;s+=6){const x=ax+(mx-ax)*s/L,y=ay+(my-ay)*s/L;F(x-1,y-1,3,3,'#0f0b15');F(x,y,2,2,'#f2b33d');}}
  else if(d&&d.moved&&d.site){const bad=placeOk(d.cx,d.cy,d.site);headframe(d.cx*4+2,d.cy*4+2,false,bad?'#ec4b3f':'#77d65b');}
  else if(h&&!UI.hover&&!UI.modal&&G.build.sites.length<MAXSITES){const bad=placeOk(h[0],h[1]);
    if(!bad&&!reduced?(t/500|0)%2:!bad){TG.c.globalAlpha=.55;headframe(h[0]*4+2,h[1]*4+2,false,'#77d65b');TG.c.globalAlpha=1;}}
  txtS(UI.geo?'GEOLOGY: SAND DEPTH  (YELLOW = DEEP SAND, GREY = ROCK AT SURFACE)':'REGION 7 SURVEY  -  1 SQUARE = 25 M',6,349,'#efe6cf');
}
function buildNodeAt(x,y){for(const s of G.build.sites){const [px,py]=sitePx(s);if(Math.abs(x-px)<=8&&y>=py-14&&y<=py+8)return s.id;}
  const [cx_,cy_]=sitePx(siteById('CC'));if(Math.abs(x-cx_)<=9&&Math.abs(y-cy_)<=8)return 'CC';return null;}
function buildLinkAt(x,y){let best=null,bd=6;G.build.tunnels.forEach((tn,i)=>{const [ax,ay]=sitePx(siteById(tn.a)),[bx,by]=sitePx(siteById(tn.b));
  const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy,u=clamp(((x-ax)*dx+(y-ay)*dy)/L2,0,1),d=Math.hypot(ax+dx*u-x,ay+dy*u-y);if(d<bd){bd=d;best=i;}});return best;}
function buildDown(x,y){const id=buildNodeAt(x,y);UI.drag={site:id&&id!=='CC'?id:null,node:id,sx:x,sy:y,moved:false,cx:0,cy:0};}
function buildMove(e,x,y){
  const d=UI.drag;if(d&&d.site&&Math.hypot(x-d.sx,y-d.sy)>5){d.moved=true;d.cx=clamp(Math.floor(x/4),0,MW-1);d.cy=clamp(Math.floor(y/4),0,MH-1);}
  UI.hover=buildNodeAt(x,y);UI.hoverLink=UI.hover?null:buildLinkAt(x,y);
  const cx=clamp(Math.floor(x/4),0,MW-1),cy=clamp(Math.floor(y/4),0,MH-1);UI.hoverCell=[cx,cy];
  cv.style.cursor=UI.hover?(UI.pick?'copy':'grab'):UI.pick?'crosshair':'pointer';
  let h;
  if(UI.hover){const s=siteById(UI.hover);if(UI.hover==='CC')h=`<b>CC Shelter Control</b><br>The old wing command post, 40 m down in rock. Already built.`;
    else{const st=siteStats(s);h=`<b>${s.id} ${esc(s.name)}</b><br>${st.beds} beds · ${st.depth} m deep · ${mil(st.total)}<br><span class="dim">Click to select · drag to move</span>`;}}
  else if(UI.hoverLink!=null){const tn=G.build.tunnels[UI.hoverLink],ts=tunnelStats(tn);h=`<b>${tn.a}–${tn.b} tunnel</b><br>${num(ts.len)} m at ${tn.depth} m deep · ${R0(ts.rockFrac*100)}% in rock<br>Reliability ${R0(ts.rel*100)}% · ${mil(ts.cost)}`;}
  else{const i=idx(cx,cy),sd=WD.sand[i],[tw,dist]=nearestTown(cx,cy);
    h=`<b>${TYPE_NAME[WD.type[i]]}</b>${WD.type[i]?`<br>Sand ${R0(sd)} m, then rock`:''}<br>${num(dist*MPC)} m from ${cap1(tw.name)}`;
    const bad=WD.type[i]===0?null:placeOk(cx,cy);
    if(UI.pick)h+='<br><span class="dim">Click a shelter to tunnel to</span>';
    else if(G.build.sites.length<MAXSITES&&WD.type[i])h+=bad?`<br><span class="neg">${bad}</span>`:'<br><span class="pos">Click to place a shelter here</span>';}
  placeTip(e,h);
}
function buildUp(x,y){const d=UI.drag;UI.drag=null;if(!d)return;
  if(d.moved&&d.site){const bad=placeOk(d.cx,d.cy,d.site);if(bad){toast(bad,true);buzz();return;}const s=siteById(d.site);s.x=d.cx;s.y=d.cy;recomputeRoads();clampTunnels();thud();refresh();return;}
  const id=buildNodeAt(x,y);
  if(UI.pick){if(id&&id!==UI.pick){const a=UI.pick;setPick(null);openTunnel(a,id);}else if(!id)setPick(null);return;}
  if(id){UI.sel=id;UI.selLink=null;UI.tab='site';blip();refresh();return;}
  const li=buildLinkAt(x,y);if(li!=null){UI.selLink=li;UI.tab='tunnels';blip();refresh();return;}
  const cx=clamp(Math.floor(x/4),0,MW-1),cy=clamp(Math.floor(y/4),0,MH-1);
  if(G.build.sites.length>=MAXSITES){toast(`The program funds at most ${MAXSITES} shelters.`,true);buzz();return;}
  const bad=placeOk(cx,cy);if(bad){toast(bad,true);buzz();return;}
  const s=newSite(cx,cy);G.build.sites.push(s);G.build.sites.sort((a,b)=>a.slot-b.slot);recomputeRoads();UI.sel=s.id;UI.tab='site';thud();
  toast(`${s.id} ${cap1(s.name)} placed. Sand here is ${R0(sandAt(cx,cy))} m deep. Open the designer to shape the shaft.`);refresh();
}
function setPick(id){UI.pick=id;renderHint();}
function renderHint(){const h=$('#hint');
  if(G.phase==='build'){if(UI.pick){h.textContent=`Click the shelter to tunnel to from ${UI.pick}. Esc cancels.`;h.className='pick';}
    else{h.textContent=G.build.sites.length<MAXSITES?'Click open ground to place a shelter. Drag a shelter to move it. Roads are laid automatically.':'All six shelters placed. Select one to design it or dig tunnels.';h.className='';}
    $('#legend').innerHTML=`<button class="btn small" id="geoBtn" type="button">${UI.geo?'Show terrain':'Show geology (sand depth)'}</button><span class="dim">Sand is cheap to dig but needs heavy lining and gives weak protection. Rock costs more to blast but holds.</span>`;
    $('#geoBtn').onclick=()=>{UI.geo=!UI.geo;renderHint();};}

    $('#legend').innerHTML=`<span class="key"><i class="sw" style="background:var(--water)"></i>Water</span><span class="key"><i class="sw" style="background:var(--air)"></i>Air</span><span class="key"><i class="sw" style="background:var(--amber)"></i>Power</span><span class="key"><i class="sw" style="background:var(--fuel)"></i>Fuel</span><span class="dim">Gauges: air · water · power · fuel. Moving dots are active flows.</span>`;}
}

/* ================= build: panels ================= */
function buildTabs(){return [['site','Shelter'],['tunnels','Tunnels'],['plan','Budget']];}
function buildSide(){
  if(UI.tab==='tunnels')return tunnelsPanel();
  if(UI.tab==='plan')return planPanel();
  if(!UI.sel||!siteById(UI.sel))return `<div class="sect"><span class="big">Choose sites</span><p>Click open ground on the map to place up to six shelters. Each one gets a road to the nearest highway automatically.</p>
    <p class="dim">Hover the map to see what is under it. Shallow sand is cheap to dig but needs a concrete lining and gives poor blast protection. Rock is expensive to blast and strong. Shelters near towns fill up fast; remote ones fill slowly.</p>
    <p class="dim">Shelter Control (CC) already exists in the old command post, 40 m down in rock. Tunnel your shelters to it and to each other.</p></div>${planSummary()}`;
  if(UI.sel==='CC')return `<div class="sect"><span class="big">CC Shelter Control</span><div class="dim">The old wing command post. 40 m deep in rock, 80 beds, a 200 kW generator plant and a 40,000 L cistern. Already built.</div>
    <div class="actions"><button class="btn" data-act="tunnel" type="button">Dig a tunnel from here…</button></div></div>`;
  const s=siteById(UI.sel),st=siteStats(s),w=siteWarnings(s),[tw,td]=nearestTown(s.x,s.y);
  return `<div class="sect"><div class="row"><span class="big">${s.id} ${esc(s.name)}</span><span class="chip ${w.some(x=>x[0]==='err')?'CRIT':w.length?'WARN':'OK'}">${w.some(x=>x[0]==='err')?'INCOMPLETE':w.length?'CHECK':'READY'}</span></div>
    <div class="dim">${TYPE_NAME[WD.type[idx(s.x,s.y)]]} · ${num(td*MPC)} m from ${cap1(tw.name)} · warden ${esc(s.warden)}</div>
    <div class="actions"><button class="btn primary" data-act="design" type="button">Design silo…</button><button class="btn" data-act="tunnel" type="button">Dig tunnel…</button><button class="btn danger small" data-act="remove" type="button">Remove</button></div></div>
  <div class="sect"><span class="lbl">Ground</span>${groundBar(st.sand,st.depth)}<div class="dim" style="font-size:14px">Sand ${R0(st.sand)} m, then rock. Shaft ${st.depth} m: ${R0(st.sandM)} m in sand, ${R0(st.rockM)} m in rock.</div>
    <div class="row"><span>Blast protection</span><span class="num">${R0(st.prot*100)}%</span></div>${meter(st.prot,.9,st.prot<.35?'var(--bad)':st.prot<.6?'var(--warn)':'var(--ok)')}</div>
  <div class="sect"><span class="lbl">What it holds</span>${capGrid(st)}</div>
  <div class="sect"><span class="lbl">Cost</span><div class="ledger">${L_('Excavation','  '+mil(st.dig))}${L_('Shaft lining',mil(st.line))}${L_(`Head works and blast door (Ø${s.d0} m)`,mil(st.head))}${L_('Fit-out',mil(st.fit))}${L_('First fill of water, fuel and food',mil(st.stock))}${L_(`Road, ${num((s.roadCells||0)*MPC)} m`,mil(st.road))}<span class="tot">Total</span><span class="tot num">${mil(st.total)}</span></div></div>
  ${w.length?`<div class="sect"><span class="lbl">Check</span><ul class="warns">${w.map(([k,m])=>`<li class="${k}">${esc(m.replace(/^S\d: /,''))}</li>`).join('')}</ul></div>`:''}`;
}
function groundBar(sand,depth){const max=Math.max(depth,sand,40)+4;return `<div class="stack" style="height:18px">
  <span style="width:${Math.min(sand,max)/max*100}%;--c:#c9a85e"></span><span style="width:${(max-Math.min(sand,max))/max*100}%;--c:#77757f"></span><b style="left:calc(${depth/max*100}% - 2px)" title="Shaft bottom"></b></div>
  <div class="row dim" style="font-size:12px"><span>0 m</span><span>shaft bottom ${depth} m</span><span>${R0(max)} m</span></div>`;}
function capGrid(st){const c=(lab,v,cls='')=>`<div><span class="lbl">${lab}</span><span class="v ${cls}">${v}</span></div>`;
  return `<div class="kv">${c('Beds',`${st.beds}`)}${c('Expected intake',`${st.roster}`,st.roster>st.beds?'neg':'')}${c('Air',`${R0(st.scrub/Math.max(1,st.need)*100)}%`,st.scrub<st.need?'neg':'pos')}
    ${c('Power',`${st.gcap} / ${R0(st.load)} kW`,st.gcap<st.load?'neg':'pos')}${c('Water',st.waterSh>=99?'—':`${Math.floor(st.waterSh)} shifts`,st.waterSh<12?'neg':'')}
    ${c('Fuel',st.fuelSh?`${Math.floor(st.fuelSh)} shifts`:'none',st.fuelSh<12?'neg':'')}${c('Food',st.foodSh?`${Math.floor(st.foodSh)} shifts`:'none',st.foodSh<12?'neg':'')}
    ${c('Bays',`${st.used} / ${st.bays}`,st.used>st.bays?'neg':'')}</div><div class="dim" style="font-size:13px">Water, fuel and food are for full tanks with a full house. A shift is 6 hours; relief comes 22 to 30 shifts after the sirens.</div>`;}

    <div class="sect"><span class="lbl">Before you commission</span><ul class="warns">${w.map(([k,m])=>`<li class="${k}">${esc(m)}</li>`).join('')||'<li class="pos">Everything checks out.</li>'}</ul>

  let h=`<div class="sect"><span class="lbl">Tunnels</span><div class="dim" style="font-size:14px">Select a shelter and choose Dig tunnel, then click the other end. Depth decides how much of the route runs through sand or rock. Rock tunnels cost more and survive the shock much better.</div></div>`;

function buildSideClick(e){
  const b=e.target.closest('[data-act]'),a2=e.target.closest('[data-sel]');
  if(a2){e.preventDefault();UI.sel=a2.dataset.sel;UI.tab='site';refresh();return;}
  if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='design')openDesigner(UI.sel);
  if(a==='tunnel'){setPick(UI.sel);toast(`Click the shelter to connect to ${UI.sel}.`);}
  if(a==='remove'){const id=UI.sel;G.build.sites=G.build.sites.filter(s=>s.id!==id);G.build.tunnels=G.build.tunnels.filter(t=>t.a!==id&&t.b!==id);UI.sel=null;recomputeRoads();toast(`${id} removed.`);refresh();}
  if(a==='edittun'){const tn=G.build.tunnels[+b.dataset.i];openTunnel(tn.a,tn.b);}

  for(const f of S.flows.filter(f=>f.type==='P')){const got=run('P',f,a=>a.gen-a.pout,()=>1e9);if(N[f.from])N[f.from].pout+=f.actual;if(N[f.to])N[f.to].pin+=got;}
  for(const id of ids()){const n=N[id],s=n.s,L=n.L;
    if(n.dead)Object.assign(n,{avail:0,baseF:0,scrubF:0,plantF:0,used:0,burn:0,bal:0,genUsed:0});
    else if(S.grid)Object.assign(n,{avail:n.load,baseF:1,scrubF:1,plantF:1,used:n.load,burn:0,bal:0,genUsed:0});
    else{let a=Math.max(0,n.gen-n.pout)+n.pin;n.avail=a;n.baseF=Math.min(1,a/L.base);a=Math.max(0,a-L.base);
      n.scrubF=L.scrub?Math.min(1,a/L.scrub):0;a=Math.max(0,a-L.scrub*n.scrubF);n.plantF=Math.min(1,a/L.plant);
      n.used=n.baseF*L.base+n.scrubF*L.scrub+n.plantF*L.plant;n.genUsed=Math.max(0,Math.min(n.gen,n.used+n.pout-n.pin));n.burn=R0(2*n.genUsed);n.bal=n.avail-n.load;}
    n.scrubOut=s.scrubCap*s.scrub/100*n.scrubF;n.need=s.pop*CFM_PER_PERSON;}
  for(const f of S.flows.filter(f=>f.type==='A')){const got=run('A',f,a=>a.scrubOut-a.aout,()=>1e9);if(N[f.from])N[f.from].aout+=f.actual;if(N[f.to])N[f.to].ain+=got;}
  for(const id of ids()){const n=N[id],s=n.s;n.supply=n.scrubOut-n.aout+n.ain;const r=n.need>0?(n.supply-n.need)/n.need:1;
    n.airDelta=war()?clamp(r*40,-25,6)-(s.hull<50?3:0):(96-s.air)*.5;
    n.use=war()?s.pop*WATER_PER_PERSON:0;n.rec=Math.min(n.use,s.plantCap)*.5*s.plant/100*n.plantF;n.recPct=n.use?n.rec/n.use:0;
    n.foodUse=war()?s.pop*FOOD_PER_PERSON:0;}
  for(const f of S.flows.filter(f=>f.type==='W')){const got=run('W',f,a=>a.s.water-a.wout,(a,neck)=>neck*a.plantF);if(N[f.from])N[f.from].wout+=f.actual;if(N[f.to])N[f.to].win+=got;}
  for(const id of ids()){const n=N[id],s=n.s;n.wnet=n.win-n.wout-(war()?n.use-n.rec+s.leak:0);}
  N._R=R;return N;
}
function siteStatus(s,n){if(s.evac)return 'EVAC';if(s.lost)return 'DARK';n=n||compute()[s.id];
  const sh=n.wnet<0?s.water/-n.wnet:99;
  if(s.air<50||(war()&&sh<2)||n.baseF<1||s.hull<40||(war()&&s.food<=0))return 'CRIT';
  if(s.air<72||(war()&&sh<5)||n.scrubF<1||n.plantF<1||s.hull<70||s.gen<30||s.scrub<30||s.plant<30||s.pop>s.cap||(war()&&n.supply<n.need)||(war()&&s.food<n.foodUse*4))return 'WARN';
  return 'OK';}

function scheduled(k){const D=S.flags.defects||[],F=S.flags;
  const ok=id=>id&&st(id)&&!st(id).lost&&!st(id).evac;
  switch(k){
    case 'defgen':if(ok(D[0]))sendKey(k,{s:D[0]});return;
    case 'defscrub':if(ok(D[1])&&st(D[1]).scrub<100)sendKey(k,{s:D[1]});return;
    case 'defplant':if(ok(D[2])&&st(D[2]).plant<100)sendKey(k,{s:D[2]});return;
    case 'review':if(shelters().length)sendKey(k);return;
    case 'fuel':{const c=liveShelters().filter(i=>st(i).gcap).sort((a,b)=>sealedProj(a).fuel-sealedProj(b).fuel)[0];if(c)sendKey(k,{s:c});return;}
    case 'drill':{const l=S.links.find(l=>l.a!=='CC'&&l.b!=='CC');if(l)sendKey(k,{a:l.a,b:l.b});return;}
    case 'hit':if(ok(F.hit))sendKey(k,{s:F.hit,drill:F.drill&&F.drill.includes(F.hit)});return;
    case 'fire':if(ok(F.fire))sendKey(k,{s:F.fire});return;
    case 'survey':if(S.links.length)sendKey(k);return;
    case 'vent':if(ok(F.shock))sendKey(k,{s:F.shock});return;
    case 'genloss':if(ok(F.genloss))sendKey(k,{s:F.genloss,cut:F.genlossCut});return;
    case 'evac':{const c=liveShelters().map(id=>{const n=compute()[id];return [id,st(id).air+(n.wnet<0?Math.min(40,st(id).water/-n.wnet*4):40)];}).sort((a,b)=>a[1]-b[1]);
      for(const [id,score] of c){if(score>110)break;const to=neighbors(id).find(x=>{const l=findLink(id,x);return passable(l)&&x!=='CC'&&!st(x).lost&&!st(x).evac&&st(x).pop<st(x).cap*1.25;});
        if(to){sendKey('evac',{s:id,to});return;}}
      const h=liveShelters()[0];if(h)sendKey('hold',{s:h});return;}
    case 'hatch':{const c=liveShelters().map(id=>{const [t,d]=nearestTown(st(id).x,st(id).y);return [id,t,d];}).sort((a,b)=>a[2]-b[2])[0];if(c)sendKey(k,{s:c[0],town:c[1].name,n:80+Math.floor(rnd()*7)*10});return;}
    default:sendKey(k);
  }
}

  if(l.collapsed){const r=mul(300+i);for(let k=0;k<26;k++){const u=.35+r()*.3,o=(r()-.5)*12;F(ax+dx*u+nx*o,ay+dy*u+ny*o,2,2,r()<.5?'#5d5e6b':'#0f0b15');}}

  if(!cut)for(const k of ['W','A','P']){const fw=R['fw'+k],bw=R['bw'+k];if(!fw&&!bw)continue;const ph=reduced?0:(t*.018)%9;
    for(let d=ph;d<L;d+=9){if(fw){const u=d/L;F(ax+dx*u+nx*OFF[k]-1,ay+dy*u+ny*OFF[k]-1,2,2,COL[k]);}if(bw){const u=1-d/L;F(ax+dx*u+nx*OFF[k]-1,ay+dy*u+ny*OFF[k]-1,2,2,COL[k]);}}}

function drawChip(i,t){const l=S.links[i],[ax,ay,bx,by]=linkPts(i),x=(ax+bx)/2,y=(ay+by)/2,cut=!l.ok||l.hp<=0,hurt=!cut&&l.hp<100,R=UI.N._R[i];

/* ---------------- people ---------------- */
const CRAWL=80;
function peopleRoute(a,b){const r=bfs(a,b,i=>passable(S.links[i])&&((S.pmoved||{})[i]||0)<CRAWL);if(!r)return null;r.cap=Math.min(...r.links.map(i=>CRAWL-((S.pmoved||{})[i]||0)));return r;}
function movePeople(a,b,n){const A=st(a),B=st(b);if(!A||!B||A.lost||A.evac||B.lost||B.evac)return [false,'One of those shelters is dark.'];
  const r=peopleRoute(a,b);if(!r)return [false,`No open crawlway connects ${a} and ${b}, or this shift's capacity is used up.`];
  n=Math.min(n,r.cap,Math.max(0,A.pop-A.staff));if(n<=0)return [false,`${a} has nobody it can send.`];
  A.pop-=n;B.pop+=n;B.morale=clamp(B.morale-n/40,0,100);A.morale=clamp(A.morale+n/60,0,100);S.pmoved=S.pmoved||{};for(const i of r.links)S.pmoved[i]=(S.pmoved[i]||0)+n;
  if(S.stats)S.stats.people=(S.stats.people||0)+n;ev(`${n} people walked from ${a} to ${b} via ${r.nodes.join('-')}.`,true);
  return [true,`${n} people are walking from ${a} to ${b} through ${r.nodes.join(' → ')}.`];}
/* ---------------- transfer dialog ---------------- */
function openTransfer(from,to){
  if(!to){to=neighbors(from).find(x=>!st(x).lost&&!st(x).evac)||ids().find(x=>x!==from);}

  {k:'aftershock',w:3,max:5,tier:2},{k:'genloss',w:2.5,max:4,tier:2},{k:'hatch',w:2.5,max:4,tier:2},{k:'radio',w:1,max:1,tier:2},{k:'crowding',w:1.6,max:2,tier:2},
  {k:'flood',w:2,max:3,tier:3},{k:'fuelbad',w:1.5,max:2,tier:3},{k:'collapse',w:1.7,max:2,tier:3},{k:'breach',w:1.5,max:2,tier:3},{k:'coleak',w:1.5,max:2,tier:3},
  {k:'sick',w:2,max:3,tier:4},{k:'vent',w:2,max:2,tier:4},{k:'fever',w:1.5,max:2,tier:4},{k:'badfood',w:1.3,max:2,tier:4},{k:'stairs',w:1.3,max:2,tier:4},
  {k:'plume',w:1.5,max:2,tier:5},{k:'delay',w:1.2,max:2,tier:5}];
function drawEvents(){const e=S.evRate||[.08,.5,.86],r=rnd(),n=r<e[0]?0:r<e[1]?1:r<e[2]?2:3;
  for(let i=0;i<n;i++){const pool=DECK.filter(d=>(d.tier||1)<=(S.tier||5)&&(S.deck[d.k]||0)<d.max);const d=pickW(pool,x=>x.w);if(!d)return;if(runEvent(d.k)&&S.stats.events++>=0)S.deck[d.k]=(S.deck[d.k]||0)+1;}}
function runEvent(k){const live=liveShelters();if(!live.length)return false;const any=()=>live[Math.floor(rnd()*live.length)];
  switch(k){
    case 'aftershock':{const ch=[];for(const l of S.links){if(!l.ok)continue;const r=rnd(),f=1-l.rel;if(r<f*.35){l.ok=false;l.hp=0;S.stats.cuts++;ch.push(`${linkName(l)} severed`);}else if(r<f*.9){l.hp=Math.max(20,l.hp-R0(25+rnd()*30));ch.push(`${linkName(l)} down to ${l.hp}%`);}}
      for(const id of live){const s=st(id);s.hull=Math.max(0,R0(s.hull-(1-s.prot)*12*rnd()));}
      ev(`Aftershock.${ch.length?' '+ch.join(', ')+'.':' The tunnels held.'}`);sendKey('aftershock',{ch});return true;}
    case 'genloss':{const c=pickW(live.filter(i=>st(i).gcap&&st(i).gen>20),i=>1.1-st(i).prot);if(!c)return false;st(c).gen=Math.max(0,st(c).gen-40);ev(`${c} generator plant damaged.`);sendKey('genloss',{s:c});return true;}
    case 'vent':{const c=pickW(live.filter(i=>st(i).scrubCap&&st(i).scrub>30),()=>1);if(!c)return false;st(c).scrub=Math.max(0,st(c).scrub-35);ev(`${c} scrubber housing cracked.`);sendKey('vent',{s:c});return true;}
    case 'fire':{const c=any();st(c).air=clamp(st(c).air-15,0,100);st(c).morale-=5;ev(`Cable vault fire at ${c}. Air -15.`);sendKey('fire',{s:c});return true;}
    case 'leak':{const c=pickW(live.filter(i=>st(i).water>500),()=>1);if(!c)return false;const s=st(c),lost=R0(s.water*.12);s.water-=lost;s.leak+=120;ev(`${c} tank seam split: -${num(lost)} L, still leaking.`);sendKey('leak',{s:c,lost});return true;}
    case 'flood':{const c=pickW(live.filter(i=>st(i).sandM>6),i=>st(i).sandM);if(!c)return false;const s=st(c);s.hull=Math.max(0,s.hull-12);s.plant=Math.max(0,s.plant-30);const lost=R0(s.water*.25);s.water-=lost;ev(`${c}: groundwater through the sand lining. Water plant -30%, ${num(lost)} L contaminated.`);sendKey('flood',{s:c,lost});return true;}
    case 'fuelbad':{const c=pickW(live.filter(i=>st(i).gcap&&st(i).fuel>500),()=>1);if(!c)return false;const s=st(c),lost=R0(s.fuel*.35);s.fuel-=lost;ev(`${c}: contaminated diesel, ${num(lost)} L drained.`);sendKey('fuelbad',{s:c,lost});return true;}
    case 'sick':{const c=pickW(live,i=>st(i).pop/Math.max(1,st(i).cap));if(!c)return false;const s=st(c);s.morale-=15;casualties(s,s.pop*.01,'dysentery');sendKey('sick',{s:c});return true;}
    case 'hatch':{const done=S.flags.hatchDone||[];const cand=live.filter(i=>!done.includes(i));if(!cand.length)return false;
      const c=pickW(cand,i=>{const [t,d]=nearestTown(st(i).x,st(i).y);return 1/(1+d/20);});const [t]=nearestTown(st(c).x,st(c).y);
      S.flags.hatchDone=[...done,c];sendKey('hatch',{s:c,town:t.name,n:40+Math.floor(rnd()*10)*10});return true;}
    case 'delay':{const d=1+(rnd()<.35?1:0);S.relief+=d;ev(`Relief convoy delayed ${d*6} hours.`);sendKey('delay',{d});return true;}
    case 'scrubfault':{const c=pickW(live.filter(i=>st(i).scrubCap),()=>1);if(!c)return false;st(c).scrub=Math.max(0,st(c).scrub-15);ev(`${c} scrubber fan bearing failing. -15%.`);return true;}
    case 'birth':{const c=any(),s=st(c);s.pop+=1;s.morale=clamp(s.morale+10,0,100);ev(`A baby was born at ${c}.`);sendKey('birth',{s:c});return true;}
    case 'rats':{const c=pickW(live.filter(i=>st(i).food>300),()=>1);if(!c)return false;const s=st(c),lost=R0(s.food*.12);s.food-=lost;ev(`Rats in the ${c} storeroom: ${num(lost)} rations spoiled.`);sendKey('rats',{s:c,lost});return true;}
    case 'volunteer':{const c=any();st(c).spares++;ev(`${c}: a machinist from town rebuilt a spare kit from salvage.`);sendKey('volunteer',{s:c});return true;}
    case 'radio':{for(const i of live)st(i).morale=clamp(st(i).morale+6,0,100);ev('A radio broadcast from the capital: the government is functioning. Morale up everywhere.');sendKey('radio');return true;}
    case 'crowding':{const c=pickW(live,i=>{const [t,d]=nearestTown(st(i).x,st(i).y);return 1/(1+d/20);});const s=st(c),n=R0(s.cap*(.08+rnd()*.08));s.pop+=n;ev(`${n} more people from town reached ${c} through a service adit.`);sendKey('crowding',{s:c,n});return true;}
    case 'collapse':{const cand=S.links.filter(l=>!l.collapsed&&l.ok);if(!cand.length)return false;const l=pickW(cand,x=>1.05-x.rel);l.collapsed=true;S.stats&&S.stats.cuts++;const kept=[],lost=[];
      for(const k of ['W','A','P'])if(l.cap[k]>0){if(rnd()<.5){l.cap[k]=0;lost.push(RNAME[k].toLowerCase());}else kept.push(RNAME[k].toLowerCase());}
      if(!kept.length){l.ok=false;l.hp=0;}
      ev(`The ${linkName(l)} tunnel collapsed. No passage for people.${kept.length?` Still carrying ${kept.join(' and ')}.`:' Every line in it is gone.'}`);sendKey('collapse',{l:linkName(l),kept,lost});return true;}
    case 'breach':{const c=pickW(live,i=>1.1-st(i).prot);if(!c)return false;const s=st(c);s.hull=Math.max(0,s.hull-12);s.air=clamp(s.air-8,0,100);s.morale-=8;ev(`${c}: the outer blast door seal failed. Fallout in the entry, hull -12.`);sendKey('breach',{s:c});return true;}
    case 'coleak':{const c=pickW(live.filter(i=>st(i).gcap),()=>1);if(!c)return false;const s=st(c);s.air=clamp(s.air-10,0,100);s.gen=Math.max(0,s.gen-10);ev(`${c}: generator exhaust leaking into the gallery. Air -10.`);sendKey('coleak',{s:c});return true;}
    case 'fever':{const c=pickW(live.filter(i=>!st(i).busy),()=>1);if(!c)return false;const s=st(c);s.ill=2;s.busy='STAFF DOWN WITH FEVER';ev(`${c}: half the staff are down with fever. No repairs there for a while.`);sendKey('fever',{s:c});return true;}
    case 'badfood':{const c=pickW(live.filter(i=>st(i).food>300),()=>1);if(!c)return false;const s=st(c),lost=R0(s.food*.2);s.food-=lost;s.morale-=5;ev(`${c}: a batch of rations went bad. ${num(lost)} thrown out.`);sendKey('badfood',{s:c,lost});return true;}
    case 'stairs':{const c=pickW(live,i=>st(i).pop/Math.max(1,st(i).cap));const s=st(c);s.morale-=10;casualties(s,s.pop*.005,'crush on the stairs');sendKey('stairs',{s:c});return true;}
    case 'plume':{const hit=live.filter(i=>st(i).hull<80);if(!hit.length)return false;for(const i of hit)st(i).air=clamp(st(i).air-8,0,100);ev(`Heavy fallout plume over the region. Air -8 at ${hit.join(', ')}.`);sendKey('plume',{hit});return true;}
  }return false;}
function checkEvac(){const N=compute();
  for(const id of liveShelters()){if(S.flags['ev'+id])continue;const s=st(id),n=N[id],sh=n.wnet<0?s.water/-n.wnet:99;
    if(!(s.air<55||sh<2||(s.food<=0&&s.hungry>1)))continue;
    const to=neighbors(id).find(x=>{const l=findLink(id,x);return passable(l)&&x!=='CC'&&!st(x).lost&&!st(x).evac&&st(x).pop<st(x).cap*1.2;});
    if(to){S.flags['ev'+id]=1;sendKey('evac',{s:id,to});return;}}}
Object.assign(MAILS,{
  birth:p=>({from:p.s,subj:'A GIRL, 3.1 KG',body:`Control,\n\nA baby girl was born in the bunk bays at ${shortT(S.shift)}. Mother and child are fine. The staff gave her the last of the oranges.\n\nPeople are smiling for the first time since the doors shut.\n${sig(p.s)}`}),
  rats:p=>({from:p.s,subj:'RATS',body:`Control,\n\nRats got into the storeroom through a cable duct. ${num(p.lost)} rations are spoiled. We have sealed the duct with grout and a mattress.\n${sig(p.s)}`}),
  volunteer:p=>({from:p.s,subj:'A MACHINIST',body:`Control,\n\nOne of the people from town ran a machine shop. He took apart a dead fan motor and a bunk frame and made us a working spares kit. We hold ${kits(st(p.s).spares)} now.\n${sig(p.s)}`}),
  radio:()=>({from:'SYS',subj:'BROADCAST RECEIVED',body:`Emergency broadcast received on the national band:\n\n"THE GOVERNMENT IS FUNCTIONING. STAY IN YOUR SHELTERS. RELIEF IS BEING ORGANIZED REGION BY REGION."\n\nRelayed to all shelters.`}),
  crowding:p=>({from:p.s,subj:'MORE PEOPLE',body:`Control,\n\n${p.n} more people from town found the service adit and came in before we could seal it. We are ${st(p.s).pop} on ${st(p.s).cap} beds.\n\nIf a neighbour has room, we can walk people through the tunnel. Use the transfer panel and choose People.\n${sig(p.s)}`}),
  collapse:p=>({from:'ENG',subj:`TUNNEL ${p.l} COLLAPSED`,body:`Controller,\n\nThe ${p.l} tunnel has collapsed along a stretch of about thirty metres. The crawlway is gone; nobody will walk through it again.\n\n${p.kept.length?`The ${p.kept.join(' and ')} line${p.kept.length>1?'s are':' is'} still live inside the rubble.`:'Every line in it is cut.'}${p.lost.length?` Lost: ${p.lost.join(', ')}.`:''} This cannot be repaired from inside.\n- CHIEF ENG. K. DOSS`}),
  breach:p=>({from:p.s,subj:'OUTER DOOR SEAL',body:`Control,\n\nThe seal on the outer blast door failed under the last shock. Fallout dust in the entry and the intake room. We have closed the inner door and taped the frame. Hull integrity ${R0(st(p.s).hull)}%.\n${sig(p.s)}`}),
  coleak:p=>({from:p.s,subj:'EXHAUST LEAK',body:`Control,\n\nThe generator exhaust stack cracked where it passes the gallery. People were getting headaches before anyone understood why. Air ${R0(st(p.s).air)}%. We have wrapped it, but the genset needs an overhaul.\n${sig(p.s)}`}),
  fever:p=>({from:p.s,subj:'STAFF SICK',body:`Control,\n\nHalf my staff are down with fever. The rest are running the bunk bays and the kitchen. No overhauls or tunnel work from us for the next two shifts.\n${sig(p.s)}`}),
  badfood:p=>({from:p.s,subj:'RATIONS SPOILED',body:`Control,\n\nA pallet of rations was stored against the warm generator wall. ${num(p.lost)} person-days of food are spoiled and thrown out.\n${sig(p.s)}`}),
  stairs:p=>({from:p.s,subj:'CRUSH ON THE STAIRS',body:`Control,\n\nA rumour went round that the elevator was running to the surface. People rushed the stairwell. We lost people in the crush before the staff got between them and the door.\n\nWe are too crowded, Control.\n${sig(p.s)}`}),
  plume:p=>({from:'HQ',subj:'FALLOUT PLUME',body:`ALL SHELTERS,\n\nA heavy fallout plume is passing over the region. Shelters with damaged shells will take some of it in: ${p.hit.join(', ')}.\n- DIR. T. HOLLIS`}),
  aftershock:p=>({from:'ENG',subj:'AFTERSHOCK',body:`Controller,\n\nAftershock through the region.${p.ch.length?`\n\n${p.ch.map(x=>'  '+x).join('\n')}\n\nShallow tunnels in sand take it worst. A crew from either end can repair a line with a spares kit.`:'\n\nEvery tunnel held this time.'}\n- CHIEF ENG. K. DOSS`}),
  leak:p=>({from:p.s,subj:'TANK SEAM SPLIT',body:`Control,\n\nA seam on our main water tank split. We lost ${num(p.lost)} L before we got a clamp on it, and it still weeps about ${st(p.s).leak} L a shift. A water plant overhaul would seal it properly.\n${sig(p.s)}`}),
  flood:p=>({from:p.s,subj:'WATER IN THE SUMP',body:`Control,\n\nGroundwater is coming through the lining where the shaft passes through sand. The sump pumps are holding, but it got into the filtration room and the lower tank. ${num(p.lost)} L contaminated and dumped; the water plant is at ${R0(st(p.s).plant)}%.\n${sig(p.s)}`}),
  fuelbad:p=>({from:p.s,subj:'BAD DIESEL',body:`Control,\n\nThe generator started hunting at 0300. Water in the day tank: the main bunker is contaminated. We drained ${num(p.lost)} L. ${num(st(p.s).fuel)} L left that we trust.\n${sig(p.s)}`}),
  sick:p=>({from:p.s,subj:'SICKNESS',body:`Control,\n\nDysentery. It started in the bunk bays two days in and it is moving fast in the crowding. ${st(p.s).pop} people on ${st(p.s).cap} beds. We have lost people already. Clean water is the only medicine we have plenty of, and not for long.\n${sig(p.s)}`}),
  delay:p=>({from:'HQ',subj:'CONVOY DELAYED',body:`ALL SHELTERS,\n\nThe relief convoy lost a bridge and is rerouting. Add ${p.d*6} hours. New ETA ${dtg(S.relief)}.\n\nI am sorry.\n- DIR. T. HOLLIS`}),
});

function stragglers(){const live=liveShelters();if(!live.length)return;const id=pickW(live,i=>{const [t,d]=nearestTown(st(i).x,st(i).y);return 1/(1+d/25);});const s=st(id),n=R0(s.cap*(.06+rnd()*.1));
  s.pop+=n;ev(`${n} stragglers forced the outer door at ${id} before it resealed.`);}
function unrest(s){const fl=R0(s.food*.12),wl=R0(s.water*.08);s.food-=fl;s.water-=wl;s.morale+=8;ev(`Unrest at ${s.id}: stores broken into. ${num(fl)} rations and ${num(wl)} L lost.`);
  if(rnd()<.4)casualties(s,s.pop*.006,'violence');
  if(!S.flags['unrest'+s.id]){S.flags['unrest'+s.id]=1;send({from:s.id,subj:'TROUBLE IN THE BUNK BAYS',body:`Control,\n\nPeople broke into the storeroom last night. We lost ${num(fl)} rations and ${num(wl)} L of water before the staff got it back under control. Morale is ${R0(s.morale)}%. People need to see that someone is doing something.\n${sig(s.id)}`});}}

cv.addEventListener('pointerdown',e=>{if(!G||UI.modal)return;const [x,y]=toMap(e);try{cv.setPointerCapture(e.pointerId);}catch(_){}G.phase==='build'?buildDown(x,y):opsDown(x,y);});
cv.addEventListener('pointermove',e=>{if(!G)return;const [x,y]=toMap(e);UI.mouse=[x,y];G.phase==='build'?buildMove(e,x,y):opsMove(e,x,y);});
cv.addEventListener('pointerup',e=>{if(!G)return;const [x,y]=toMap(e);G.phase==='build'?buildUp(x,y):opsUp(x,y);});
cv.addEventListener('pointerleave',()=>{UI.hover=null;UI.hoverLink=null;UI.hoverCell=null;$('#tip').hidden=true;});
$('#side').addEventListener('click',e=>G.phase==='build'?buildSideClick(e):opsSideClick(e));
$('#tabs').addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(!t)return;if(UI.tab===t.dataset.tab&&(t.dataset.tab==='shelter'||t.dataset.tab==='site'))UI.selLink=null;UI.tab=t.dataset.tab;refresh();});
$('#mailBtn').onclick=()=>openMail();
$('#menuBtn').onclick=()=>{UI.modal={type:'confirm'};modal(`<h2>Leave this watch?</h2><p>${G.phase==='ops'&&!S.over?'The current mission will be abandoned.':'Return to the main menu.'}</p><div class="foot"><button class="btn" id="cNo" type="button">Stay</button><button class="btn primary" id="cYes" type="button">Main menu</button></div>`);$('#cNo').onclick=closeModal;$('#cYes').onclick=()=>{closeModal();openMenu();};};
$('#mainBtn').onclick=()=>{if(G.phase==='build'){openCommission();return;}if(S.over){openEnd();return;}endShift();refresh();};
document.addEventListener('keydown',e=>{
  if(!G||e.ctrlKey||e.metaKey||e.altKey)return;const m=UI.modal,tag=(e.target.tagName||'').toLowerCase();
  if(m&&m.type==='mail'){if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();stepMail(1);return;}if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();stepMail(-1);return;}
    if(/^[1-3]$/.test(e.key)){const ms=S.mails.find(x=>x.id===m.id);if(ms.opts&&ms.resolved===null&&+e.key<=ms.opts.length){e.preventDefault();answerMail(ms,+e.key-1);}return;}}
  if(e.key==='Escape'){if(m&&!['end','title'].includes(m.type)){closeModal();return;}if(UI.pick){setPick(null);return;}if(UI.selLink!=null){UI.selLink=null;refresh();}return;}
  if(m||tag==='input'||tag==='select')return;
  if(G.phase==='ops'){if(e.key==='m'||e.key==='M')openMail();if(/^[0-6]$/.test(e.key)){const id=e.key==='0'?'CC':'S'+e.key;if(st(id)){UI.sel=id;UI.selLink=null;UI.tab='shelter';refresh();}}if(e.key==='t'||e.key==='T')openTransfer(UI.sel||'CC',null);}
  else{if(e.key==='g'||e.key==='G'){UI.geo=!UI.geo;renderHint();}if(e.key==='d'&&UI.sel&&UI.sel!=='CC')openDesigner(UI.sel);}
});

function stat(n,lab,val){const el=$('#st'+n);el.hidden=!lab;if(lab){el.querySelector('.lbl').textContent=lab;el.querySelector('strong').innerHTML=val;}}
function renderBar(){
  const ph=$('#phase');
  if(G.phase==='build'){const b=buildTotals();let beds=0;for(const s of G.build.sites)beds+=siteStats(s).beds;
    ph.textContent='CONSTRUCTION';ph.className='phase';
    stat(1,'Program budget left',`<span class="${b.left<0?'neg':''}">${mil(b.left)}</span>`);stat(2,'Shelters',`${G.build.sites.length} / ${MAXSITES}`);stat(3,'Beds',num(beds));stat(4,'Tunnels',G.build.tunnels.length);
    $('#mailBtn').hidden=true;$('#mainBtn').textContent='Commission ▸';$('#mainBtn').disabled=false;return;}
  const h=6+S.shift*6;ph.textContent='SEALED';ph.className='phase war';
  stat(1,'Time',`${14+Math.floor(h/24)} NOV 86 · ${String(h%24).padStart(2,'0')}:00`);
  stat(2,'Relief convoy',S.over?'arrived':S.shift<3?'not yet sent':`in ${(S.relief-S.shift)*6} h`);
  const alive=ids().reduce((a,i)=>a+st(i).pop,0),dead=ids().reduce((a,i)=>a+st(i).dead,0);
  stat(3,'In the shelters',`${num(alive)}${dead?` <span class="neg">· ${num(dead)} dead</span>`:''}`);
  stat(4,'Tunnels working',`${S.links.filter(l=>l.ok).length} / ${S.links.length}`);
  const un=S.mails.filter(m=>!m.read),b=$('#mailBadge');$('#mailBtn').hidden=false;b.hidden=!un.length;b.textContent=un.length;b.className='badge'+(un.some(m=>m.flash)?' flash':'');
  $('#mainBtn').textContent=S.over?'Results':'End shift ▸';
}
function renderTabs(){const tabs=G.phase==='build'?buildTabs():[['shelter','Shelter'],['flows','Tunnels & flows'],['log','Log']];
  if(!tabs.some(([k])=>k===UI.tab))UI.tab=tabs[0][0];

  const sc=$('#side').scrollTop;$('#side').innerHTML=G.phase==='build'?buildSide():opsSide();$('#side').scrollTop=sc;if(G.phase==='ops'&&UI.tab==='flows')bindFlows();renderTicker();}
